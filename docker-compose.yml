version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: greenspace-mysql
    restart: no
    environment:
      MYSQL_DATABASE: greenspace_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - greenspace_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - greenspace-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: greenspace-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - greenspace-network

  backend:
    build: .
    container_name: greenspace-backend
    restart: always
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=60000
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - greenspace-network

  frontend:
    build: ../GreenSpace-Frontend
    container_name: greenspace-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - greenspace-network


volumes:
  greenspace_db_data:
    driver: local

networks:
  greenspace-network:
    driver: bridge