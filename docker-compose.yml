version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: greenspace-mysql
    restart: always
    environment:
      MYSQL_DATABASE: greenspace_db
      MYSQL_ROOT_PASSWORD: SpringBoot2026
    ports:
      - "3306:3306"
    volumes:
      - greenspace_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - greenspace-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: greenspace-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/greenspace_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=SpringBoot2026
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=60000
    depends_on:
      - db
    networks:
      - greenspace-network

volumes:
  greenspace_db_data:

networks:
  greenspace-network:
    driver: bridge