global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'discord-notifier'

receivers:
  - name: 'discord-notifier'
    slack_configs:
      - api_url: 'https://discord.com/api/webhooks/1544685031857983551/vMZwDs3mzj3ELzFipgXSL17xuI917Fk7ZSL2dm2mnI6_kjKS4TZ6mBYEs5PWX6-VlYwE/slack'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alerts:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
          {{ end }}